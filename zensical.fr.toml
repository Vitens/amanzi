    { "Enregistrer votre travail" = "tutorials/save-your-work.md" },
  ] },
  { "Guides pratiques" = [
    "how-to/index.md",
    { "Ouvrir en ligne ou en local" = "how-to/open-hosted-or-local.md" },
    { "Enregistrer, charger, télécharger" = "how-to/save-load-download.md" },
    { "Ajouter et relier des unités" = "how-to/add-and-connect-units.md" },
    { "Configurer une unité" = "how-to/configure-a-unit.md" },
    { "Régler les indicateurs" = "how-to/set-key-figures.md" },
    { "Utiliser la vue conception" = "how-to/use-design-view.md" },
    { "Comparer dans le rapport" = "how-to/compare-in-report.md" },
    { "Travailler avec les micropolluants" = "how-to/work-with-micropollutants.md" },
    { "Copier entre scénarios" = "how-to/copy-between-scenarios.md" },
