name: Plaatbeluchting
metadata:
  version: 1.0.0
  description: Plate Aeration

## Input parameters:
parameters:
  design:
    general:
      type:
        name: Aerator Type
        description: Type of plate aeration (metal or foil)
        options: ['Metal', 'Foil']
        default: Metal
      length:
        name: Length
        description: Length of the plate aeration
        uom: m
        default: 1.0
        range: [0.1, 10.0]
      width:
        name: Width
        description: Width of the plate aeration
        uom: m
        default: 1.0
        range: [0.1, 10.0]
      hole_diameter:
        name: Hole Diameter
        description: The size of the holes in the plate
        uom: mm
        default: 1.5
        range: [0.5, 3.0]
      recirculation:
        name: Recirculation Factor
        description: Percentage of air that is recirculated
        default: 0.0
        uom: '%'
        range: [0.0, 0.8]
      efficiency:
        name: Aerator Efficiency
        description: Efficiency of the plate aeration
        uom: '-'
        default: 0.5
        range: [0.2, 1]
  operational:
    general:
      RQ:
        name: Air-Water Ratio
        description: Ratio between air and water (RQ)
        uom: '-'
        default: 50
        range: [0, 100]
      contact_time:
        name: Contact Time
        description: Time the water is in contact with the air
        uom: s
        default: 10
        range: [1, 100]
    blowerspecifications:
      supply_fan_pressure_difference:
        name: Supply Fan Pressure difference
        description: Pressure difference of the supply fan
        uom: Pa
        default: 100
        range: [10, 2000]
      exhaust_fan_pressure_difference:
        name: Exhaust Fan Pressure difference
        description: Pressure difference of the exhaust fan
        uom: Pa
        default: 100
        range: [10, 2000]
      recirculation_fan_pressure_difference:
        name: Recirculation Fan Pressure difference
        description: Pressure difference of the recirculation fan
        uom: Pa
        default: 100
        range: [10, 2000]
      supply_fan_efficiency:
        name: Supply Fan Efficiency
        description: Efficiency of the supply fan
        uom: '-'
        default: 0.75
        range: [0.5, 1]
      exhaust_fan_efficiency:
        name: Exhaust Fan Efficiency
        description: Efficiency of the exhaust fan
        uom: '-'
        default: 0.75
        range: [0.5, 1]
      recirculation_fan_efficiency:
        name: Recirculation Fan Efficiency
        description: Efficiency of the recirculation fan
        uom: '-'
        default: 0.75
        range: [0.5, 1]
  
    
## Output parameters:
outputs:
  design:
    general:
      surface:
        name: Surface Area
        description: Surface area of the plate aeration
        uom: m2
        equation: "length * width"
      surface_load:
        name: Surface Load
        description: The surface load of the plate aeration
        uom: m3/m2
        equation: "surface / capacity"
        max: 
          limit: 20
          description: "Maximum surface load is 20 m3/m2"
      watercolumn_height:
        name: Water Height
        description: Height of water column over the aeration holes
        uom: m
        equation: "capacity / (length/contact_time * width * 3600)"
      air_flow:
        name: Process Air Flow
        description: Air flow through the plate aeration
        uom: m3/h
        equation: "capacity * RQ"  
      supply_fan_flow:
        name: Supply Fan Air Flow
        description: Air flow through the fan
        uom: m3/h
        equation: "air_flow"
      recirculation_fan_flow:
        name: Recirculation Fan Air Flow
        show: "recirculation"
        description: Air flow through the recirculation fan
        uom: m3/h
        equation: "air_flow * recirculation"
      exhaust_fan_flow:
        name: Exhaust Fan Air Flow
        description: Air flow through the exhaust fan
        uom: m3/h
        equation: "air_flow * (1 - recirculation) if recirculation > 0 else air_flow"
 
  energy:
    electric_energy:
      supply_blower_energy:
        uom: kWh/m3
        equation: "blower_power(RQ, 20 ,deltaP ,efficiency_supply, Air_density)"
        precision: 3
        parameters:
          deltaP:
            uom: Pa
            equation: "supply_fan_pressure_difference"
          efficiency_supply:
            uom: "-"
            equation: "supply_fan_efficiency"
      recirculation_blower_energy:
        uom: kWh/m3
        equation: "blower_power(RQ*recirculation, 20 ,deltaP_recirc ,efficiency_recirculation, Air_density)"
        precision: 3
        parameters:
          deltaP_recirc:
            uom: Pa
            equation: "recirculation_fan_pressure_difference"
          efficiency_recirculation:
            uom: "-"
            equation: "recirculation_fan_efficiency"
          
      exhaust_blower_energy:
        uom: kWh/m3
        equation: "blower_power(RQ*(1-recirculation), 20 ,deltaP_exhaust, efficiency_exhaust, Air_density)"
        precision: 3
        parameters:
          deltaP_exhaust:
            uom: Pa
            equation: "exhaust_fan_pressure_difference"
          efficiency_exhaust:
            uom: "-"
            equation: "exhaust_fan_efficiency"
          
