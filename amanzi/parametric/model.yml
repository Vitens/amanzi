parameters:
  design:
    general:
      units:
        default: 1
        uom: "-"
        range: [1, 40]
      minimal_capacity:
        uom: m3/h
        default: 50
        range: [1, 10000]
      nominal_capacity:
        uom: m3/h
        default: 100
        range: [1, 10000]
      maximal_capacity:
        uom: m3/h
        default: 150
        range: [1, 10000]
    hydraulic_line:
      inlet_elevation:
        uom: m
        default: 15.0
        range: [0, 20]
      influent_pressure_loss:
        uom: mH2O
        default: 0.0
        range: [0.0, 10.0]
      pressurized:
        default: false

outputs:
  hydraulic:
    hydraulic_load:
      installed_capacity:
        uom: 'm3/h'
        equation: "units * capacity"
        precision: 0
      average_day:
        uom: 'm3/h'
        equation: "quantity.inflow.product * 1e6 / 24 / 365"
        precision: 0
      max_day:
        uom: 'm3/h'
        equation: "quantity.inflow.product * 1e6 / 24 / 365 * db.max_hour"
        precision: 0
      average_day_load:
        uom: "%"
        equation: "average_day / (units*capacity)"
        validation: "average_day_load < 1"
        precision: 0
        parameters:
          max_missing_units_average_day:
            uom: "-"
            equation: "max(0,math.floor(((units * capacity) - average_day) / capacity))"
            precision: 0
            validation: "max_missing_units_average_day > 0"
      max_day_load:
        uom: "%"
        equation: "max_day / (units*capacity)"
        validation: "max_day_load < 1"
        precision: 0
        parameters:
          max_missing_units_max_day:
            uom: "-"
            equation: "max(0,math.floor(((units * capacity) - max_day) / capacity))"
            validation: "max_missing_units_max_day > 0"
            precision: 0
    hydraulic_line:
      inlet_height:
        uom: m
        equation: "inlet_elevation"
        precision: 1
      outlet_height:
        uom: m
        equation: "inlet_elevation - headloss_model if not pressurized else inlet_elevation"
        if: "outlet_height != inlet_elevation"
        precision: 1
      integrated_booster:
        uom: "-"
        if: "False"
        equation: "0"
        precision: 0
      total_headloss:
        uom: mH2O
        equation: "headloss_influent + headloss_model"
        precision: 1
        parameters:
          headloss_influent:
            uom: mH2O
            equation: "influent_pressure_loss"
            precision: 1
          headloss_model:
            uom: mH2O
            if: "headloss_model > 0"
            equation: "0"
            precision: 1
      minimal_pump_head:
        uom: mH2O
        equation: "1"
        precision: 1
        if: "integrated_booster"
      minimal_head:
        uom: mH2O
        equation: "inlet_height + influent_pressure_loss if inlet_height > outlet_height else outlet_height + total_headloss if not integrated_booster else inlet_height + minimal_pump_head"
        precision: 1  
      calculated_head_in:
        uom: mH2O
        equation: "hydraulics.head_in"
      calculated_head_out:
        uom: mH2O
        equation: "hydraulics.head_out"
      calculated_booster_head:
        uom: mH2O
        equation: "hydraulics.booster_head"
        if: "integrated_booster"

  energy:
    hydraulic_energy:
      hydraulic_energy_loss:
        uom: "kWh/m3"
        equation: "1/3600 * delta_head * 9.81 * 1/(pump_efficiency)"
        precision: 3
        if: "not integrated_booster"
        parameters:
          delta_head:
            uom: mH2O
            equation: "total_headloss - calculated_booster_head"
            precision: 1
          pump_efficiency:
            uom: "%"
            equation: "hydraulics.efficiency"
            precision: 0
      booster_energy_consumption:
        uom: "kWh/m3"
        equation: "1/3600 * delta_booster * 9.81 * 1/(booster_efficiency)"
        precision: 3
        if: "integrated_booster"
        parameters:
          delta_booster:
            uom: mH2O
            equation: "calculated_booster_head - calculated_head_out"
            precision: 0
          booster_efficiency:
            uom: "%"
            equation: "0.80"
            precision: 0