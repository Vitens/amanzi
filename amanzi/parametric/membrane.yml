parameters:
  design:

    hydraulic_line:
      inlet_elevation:
        default: 1.0
        range: [-10, 12.0]
        uom: m
      pressurized:
        default: true
        hidden: true
      pressure_loss_cartridge_filter:
        default: 2.0
        uom: mH2O
        range: [0.01, 20.0]

    stack_configuration:
      number_of_stages:
        default: 3
        range: [1, 3]
        uom: '-'
      modules_per_stage:
        default: 6
        range: [1, 10]
        uom: '-'
      optiflux:
        default: false
      stage1_vessels:
        default: 12 
        range: [1, 20]
        uom: '-'
      stage2_vessels:
        if: 
          number_of_stages: ['gt', 1]
        default: 6
        range: [1, 20]
        uom: '-'
      stage3_vessels:
        if: 
          number_of_stages: 3
        default: 3
        range: [1, 20]
        uom: '-'

  operational:
    general:
      recovery:
        default: 0.8
        range: [0.5, 0.95]
        quick: true
        uom: '%'

outputs:
  design:
    operation:
      trans_membrane_pressure:
        uom: mH2O
        equation: "calculated_feed_pressure * 10.1974" 
      net_feed_pressure:
        uom: mH2O
        equation: "trans_membrane_pressure + hydraulics.head_out"
  hydraulic:
    hydraulic_line:
      headloss_model:
        equation: "trans_membrane_pressure + pressure_loss_cartridge_filter"
        uom: mH2O
      integrated_booster:
        uom: '-'
        equation: "1"