parameters:
  design:
    general:
      bypass_capacity:
        uom: m3/h
        default: 100
        range: [0, 1000]

    reactor:
      reactor_shape:
        default: funnel
        options: [cylindrical, funnel]
      height_cylindrical:
        default: 5.0
        uom: m
        range: [1.0, 10.0]
      diameter_cylindrical:
        default: 3.0
        uom: m
        range: [0.1, 10.0]
      height_funnel:
        if: 
          reactor_shape: funnel
        default: 4.0
        uom: m
        range: [1.0, 10.0]
      diameter_funnel:
        if:
          reactor_shape: funnel
        default: 3.0
        uom: m
        range: [diameter_cylindrical, 10.0]
        range: [0.1, 10.0]
  chemicals:
    seed:
      seed_material:
        default: quartz_sand
        options: [quartz_sand, garnet_sand, calcite]
      average_seed_diameter:
        default: 0.1
        uom: mm
        range: [0.1, 10.0]
    chemicals:
      base_chemical:
        default: NaOH
        options: [NaOH, Ca(OH)2]
      acid_chemical:
        default: CO2
        options: [CO2, HCl]
      lime_type:
        if: 
          base_chemical: Ca(OH)2
        default: quicklime
        options: [quicklime, hydrated_lime, milk_of_lime]
      base_concentration:
        if: 
          or:
            base_chemical: NaOH
            lime_type: milk_of_lime
        default: 25
        uom: "%"
        range: [0, 100]
      acid_concentration:
        if: 
          acid_chemical: HCl
        default: 5
        uom: "%"
        range: [0, 100]
      acid_position:
        default: reactor-outlet
        options: [reactor-outlet, bypass, after-bypass]
  operational:
    dosing:
      base_dosage:
        default: 1.0
        uom: mmol/L
        range: [0.0, 5.0]
      acid_dosage:
        default: 0.1
        uom: mmol/L
        range: [0.0, 5.0]
    flows:
      bypass_open:
        default: 0.2
        uom: "%"
        range: [0, 1]
    pellet_bed:
      static_bed_height:
        default: 1.0
        uom: m
        range: [0.1, 10.0]
      static_bed_porosity:
        default: 0.4
        uom: "-"
        range: [0.1, 0.9]

      average_pellet_diameter:
        default: 0.5
        uom: mm
        range: [0.1, 10.0]
    
outputs:
  design:
    reactor_shape:
      total_reactor_height:
        uom: m
        equation: "height_cylindrical + height_funnel"
        parameters:
          base_height:
            uom: m
            equation: "height_cylindrical"
          funnel_height:
            uom: m
            if: "reactor_shape == 'funnel'"
            equation: "height_funnel"
      funnel_angle:
        if: "reactor_shape == 'funnel'"
        uom: degrees
        equation: "math.atan((diameter_funnel-diameter_cylindrical) / height_funnel) * 180 / math.pi"
      bottom_surface_area:
        uom: m2
        equation: "1/4 * math.pi * diameter_cylindrical**2"
      top_surface_area:
        if: "reactor_shape == 'funnel'"
        uom: m2
        equation: "1/4 * math.pi * diameter_funnel**2"
    velocities:
      velocity_cylindrical:
        uom: m/s
        equation: "capacity / bottom_surface_area"
      velocity_top:
        if: "reactor_shape == 'funnel'"
        uom: m/s
        equation: "capacity / top_surface_area"