name: Plaatbeluchting
metadata:
  version: 1.0.0
  description: Plaatbeluchting

## Input parameters:
parameters:
  design:
    type:
      name: Type Plaatbeluchter
      description: Type plaatbeluchting (metaal of folie)
      options: ['Metaal', 'Folie']
      default: Metaal
    length:
      name: Lengte
      description: Lengte van de plaatbeluchter
      uom: m
      default: 1.0
      range: [0.1, 10.0]
    width:
      name: Breedte
      description: Breedte van de plaatbeluchter
      uom: m
      default: 1.0
      range: [0.1, 10.0]
    hole_diameter:
      name: Diameter gaten
      description: De grootte van de gaatjes in de plaat
      uom: mm
      default: 1.5
      range: [0.5, 3.0]
    recirculation:
      name: Recirculatiefactor
      description: Percentage van de lucht dat wordt gerecirculeerd
      default: 0.0
      uom: '%'
      range: [0.0, 1.0]
  operational:
    RQ:
      name: Lucht-water verhouding
      description: Verhouding tussen lucht en water (RQ)
      uom: '-'
      default: 50
      range: [0, 100]
    endplate_height:
      name: Hoogte eindplaat
      description: Hoogte van de eindplaat
      uom: m
      default: 0.3
      range: [0.25, 0.4]
    supply_fan_pressure:
      name: Druk aanvoerventilator
      description: Druk van de aanvoerventilator
      uom: Pa
      default: 1000
      range: [500, 2000]
    exhaust_fan_pressure:
      name: Druk afvoerventilator
      description: Druk van de afvoerventilator
      uom: Pa
      default: 100
      range: [100, 2000]
    recirculation_fan_pressure:
      name: Druk recirculatieventilator
      description: Druk van de recirculatieventilator
      uom: Pa
      default: 1000
      range: [500, 2000]
  
    
## Output parameters:
outputs:
  design:
    surface:
      name: Oppervlakte
      description: Oppervlakte van de plaatbeluchter
      uom: m2
      equation: "length * width"
    surface_load:
      name: Oppervlaktebelasting
      description: De oppervlaktebelasting van de plaatbeluchter
      uom: m3/m2
      equation: "surface / capacity"
      max: 
        limit: 20
        description: "Maximale oppervlaktebelasting is 20 m3/m2"
    air_flow:
      name: Proceslucht
      description: Luchtstroom door de plaatbeluchter
      uom: m3/h
      equation: "capacity * RQ"  
    supply_fan_flow:
      name: Luchtstroom aanvoerventilator
      description: Luchtstroom door de ventilator
      uom: m3/h
      equation: "air_flow * (1 - recirculation) if recirculation > 0 else air_flow"
    recirculation_fan_flow:
      name: Luchtstroom recirculatieventilator
      show: "recirculation"
      description: Luchtstroom door de recirculatieventilator
      uom: m3/h
      equation: "air_flow * recirculation"
    exhaust_fan_flow:
      name: Luchtstroom afvoerventilator
      description: Luchtstroom door de afvoerventilator
      uom: m3/h
      equation: "air_flow * 1.05"
    
  
  ## calculations are per unit at standard capacity
  energy:
    supply_fan_power:
      name: Vermogen aanvoerventilator
      description: Vermogen van de aanvoerventilator
      uom: kW
      equation: "blower_power(supply_fan_flow, supply_fan_pressure)"
    recirculation_fan_power:
      name: Vermogen recirculatieventilator
      show: "recirculation"
      description: Vermogen van de recirculatieventilator
      uom: kW
      equation: "blower_power(recirculation_fan_flow, recirculation_fan_pressure)"
    exhaust_fan_power:
      name: Vermogen afvoerventilator
      description: Vermogen van de afvoerventilator
      uom: kW
      equation: "blower_power(exhaust_fan_flow, exhaust_fan_pressure)"