parameters:
  design:
    transport_pipe:
      pipe_inner_diameter:
        uom: mm
        default: 450
        range: [100, 2500]
      pipe_length:
        uom: m
        default: 1000
        range: [100, 50000]
      pipe_material:
        default: "PE"
        options: ["PE", "PVC", "Steel"]
  
outputs:
  design:
    transport_pipe:
      average_flow:
        uom: m3/h
        precision: 0
        equation: "pipeline_capacity"
      average_velocity:
        uom: m/s
        precision: 2
        equation: "pipeline_capacity / 3600 / (3.14159 * (pipe_inner_diameter/1000)**2 / 4)"
      kinematic_viscosity:
        uom: mm2/s
        precision: 2
        equation: "1.308"
      roughness:
        uom: mm
        precision: 5
        equation: "{ 'PE': 0.003, 'PVC': 0.0015, 'Steel': 0.045 }[pipe_material]"
      reynolds_number:
        uom: "-"
        precision: 0
        equation: "average_velocity * (pipe_inner_diameter/1000) / (kinematic_viscosity*1e-6)"
      darcy_coefficient:
        equation: "64/reynolds_number if reynolds_number < 2000 else 0.25/math.log10(roughness/pipe_inner_diameter/3.7 + 5.74/reynolds_number**0.9)**2"
        precision: 4
        uom: "-"
      headloss_pipe:
        uom: m
        precision: 1
        equation: "darcy_coefficient * pipe_length / (pipe_inner_diameter/1000) * average_velocity**2 / (2 * 9.81)"
      headloss_per_meter:
        uom: m/m
        precision: 3
        equation: "headloss_pipe / pipe_length"
        validation: "headloss_per_meter < 0.005"
