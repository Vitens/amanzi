parameters:
  design:
    vacuum:
      methane_reuse:
        default: false
        uom: '-'
  operational:
    general:
      vacuum_pressure:
        default: 0.2
        uom: bara
        range: [0.01, 1.0]

outputs:
  hydraulic:
    hydraulic_line:
      headloss_model:
        equation: "8"
  energy:
    vacuum_system:
      vacuum_power:
        equation: "0.12"
        uom: kWh/m3
        range: [0.1, 10.0]
    energy_production:
      generator:
        equation: "0.1"
        uom: kWh/m3
        range: [0.1, 10.0]
        if: "methane_reuse"