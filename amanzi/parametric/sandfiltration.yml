parameters:
  design:
    sandfiltration:
      dual_media:
        default: false
        uom: '-'
      height_anthracite:
        default: 0.5
        if:
          dual_media: true
        uom: m
        range: [0.1, 2.0]
      diameter_anthracite:
        default: 1.3
        if:
          dual_media: true
        uom: mm
        range: [0.1, 3.0]
      porosity_anthracite:
        default: 0.45
        if:
          dual_media: true
        uom: "-"
        range: [0.1, 0.6]
      porosity_anthracite_clogged:
        if:
          dual_media: true
        default: 0.25
        uom: "-"
        range: [0.1, 0.6]
      height_sand:
        default: 1.0
        uom: m
        range: [0.5, 3.0]
      diameter_sand:
        default: 1.3
        uom: mm
        range: [0.1, 3.0]
      porosity_sand:
        default: 0.45
        uom: "-"
        range: [0.1, 0.6]
      porosity_sand_clogged:
        default: 0.25
        uom: "-"
        range: [0.1, 0.6]
  model:
    removal_rates:
      suppress_iron_removal:
        default: false
        uom: '-'
      iron_removal_efficiency:
        default: 1.0
        if:
          suppress_iron_removal: true
        uom: '%'
        range: [0.0, 1.0]
      suppress_ammonium_removal:
        default: false
        uom: '-'
      ammonium_removal_efficiency:
        default: 1.0
        if:
          suppress_ammonium_removal: true
        uom: '%'
        range: [0.0, 1.0]
      suppress_manganese_removal:
        default: false
        uom: '-'
      manganese_removal_efficiency:
        default: 1.0
        if:
          suppress_manganese_removal: true
        uom: '%'
        range: [0.0, 1.0]    

outputs:
  design:
    general:
      bed_height:
        uom: m
        equation: "height_sand + height_anthracite"
      EBCT:
        uom: min
        equation: "bed_height / filtration_velocity * 60"
    pressure_loss:
      headloss_clean:
        uom: mH2O
        equation: "headloss_sand + headloss_anthracite if dual_media else headloss_sand"
        parameters:
          headloss_anthracite:
            uom: mH2O
            equation: "kozeny_carman(porosity_anthracite, filtration_velocity, diameter_anthracite) * height_anthracite"
            if: "dual_media"
          headloss_sand:
            uom: mH2O
            equation: "kozeny_carman(porosity_sand, filtration_velocity, diameter_sand) * height_sand"
            if: "dual_media"
      headloss_clogged:
        uom: mH2O
        equation: "headloss_sand_clogged + headloss_anthracite_clogged if dual_media else headloss_sand_clogged"
        parameters:
          headloss_anthracite_clogged:
            uom: mH2O
            equation: "kozeny_carman(porosity_anthracite_clogged, filtration_velocity, diameter_anthracite) * height_anthracite"
            if: "dual_media"
          headloss_sand_clogged:
            uom: mH2O
            equation: "kozeny_carman(porosity_sand_clogged, filtration_velocity, diameter_sand) * height_sand"
            if: "dual_media"
      average_headloss:
        uom: mH2O
        equation: "(headloss_clean + headloss_clogged) / 2"
    backwash:
      bed_expansion:
        uom: m
        equation: "expanded_height_sand + expanded_height_anthracite if dual_media else expanded_height_sand"
        parameters:
          bed_expansion_anthracite:
            if: "dual_media"
            equation: "backwash_bed_expansion(diameter_anthracite, max_rate)"
            uom: '%'
          bed_expansion_sand:
            equation: "backwash_bed_expansion(diameter_sand, max_rate)"
            uom: '%'
          expanded_height_sand:
            precision: 1
            equation: "height_sand * bed_expansion_anthracite"
            uom: m
          expanded_height_anthracite:
            precision: 1
            if: "dual_media"
            equation: "height_anthracite * bed_expansion_anthracite"
            uom: m
      backwash_headloss:
        uom: mH2O
        equation: "backwash_headloss(diameter_sand, max_rate, height_sand)+ backwash_headloss(diameter_anthracite, max_rate, height_anthracite) if dual_media else backwash_headloss(diameter_sand, max_rate, height_sand)"
        parameters:
          backwash_headloss_anthracite:
            if: "dual_media"
            equation: "backwash_headloss(diameter_anthracite, max_rate, height_anthracite)"
          backwash_headloss_sand:
            equation: "backwash_headloss(diameter_sand, max_rate, height_sand)"
      iron_load:
        uom: kg/m2
        equation: "iron_capture / surface_area"
        parameters:
          iron_capture:
            uom: kg
            equation: "(quality.influent.product.total('Fe', 'mg') - quality.effluent.product.total('Fe', 'mg'))*runtime_volume / 1000" 
          backwash_iron:
            uom: mg/L
            equation: "iron_capture / backwash_volume * 1000"