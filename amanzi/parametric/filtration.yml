parameters:
  design:
    general:
      length:
        default: 10.0
        uom: m
        range: [1.0, 10.0]
      width:
        default: 2.5
        uom: m
        range: [0.5, 5.0]
      dual_media:
        default: false
        uom: '-'
      height_sand:
        default: 1.0
        uom: m
        range: [0.5, 2.0]
      height_anthracite:
        default: 0.5
        if:
          dual_media: true
        uom: m
        range: [0.1, 1.0]
  operational:
    supernatant:
      supernatant_level:
        default: 0.2
        uom: m
        range: [0.1, 1.0]
    backwash:
      backwash_control:
        default: 'time'
        options: ['time', 'volume']
      runtime:
        default: 24.0
        if:
          backwash_control: 'time'
        uom: h
        range: [1.0, 72.0]
      runvolume:
        default: 5000
        if:
          backwash_control: 'volume'
        uom: m3
        range: [10, 100000]

outputs:
  design:
    general:
      surface_area:
        uom: m2
        equation: "length * width"
      total_surface:
        uom: m2
        equation: "surface_area * units"
      bed_height:
        uom: m
        equation: "height_sand + height_anthracite"
      filtration_velocity:
        uom: m/h
        equation: "capacity / surface_area"
      EBCT:
        uom: min
        equation: "bed_height / filtration_velocity * 60"
    flush:
      runtime_volume:
        uom: m3
        equation: "runtime * capacity"
      flush_flow:
        uom: m3/h
        equation: "flush_velocity * surface_area"
      flush_volume:
        uom: m3
        equation: "flush_flow * flush_time / 60"
      water_loss:
        uom: "%" 
        equation: "flush_volume / runtime_volume * 100"
