parameters:
  design:
    general:
      spray:
        default: false
        uom: '-'
    hydraulic_line:
      pressurized: # overwrite to enable unique translation
        default: false
        uom: '-'
      pressure_loss_nozzles:
        if:
          spray: true
        default: 1.0
        uom: mH2O
        range: [0.01, 10.0]
      fall_height_to_media:
        default: 0.5
        uom: m
        range: [0.1, 2.0]
      filter_bottom:
        default: 0.5
        uom: m
        range: [0.1, 1.0]

    filter:
      shape:
        default: 'rectangular'
        options: ['rectangular', 'circular']
      length:
        default: 10.0
        uom: m
        if:
          shape: 'rectangular'
        range: [1.0, 20.0]
      width:
        default: 2.5
        uom: m
        if:
          shape: 'rectangular'
        range: [0.5, 5.0]
      diameter:
        default: 3.0
        uom: m
        if:
          shape: 'circular'
        range: [0.2, 8.0]

  operational:
    supernatant:
      supernatant_level:
        default: 0.2
        uom: m
        range: [0.1, fall_height_to_media]
    backwash:
      backwash_pump_efficiency:
        default: 0.6
        uom: "-"
        range: [0.4, 0.8]
      backwash_head:
        uom: mH2O
        default: 5
        range: [1, 10]

      backwash_control:
        default: 'time'
        options: ['time', 'volume']
      runtime:
        default: 24.0
        if:
          backwash_control: 'time'
        uom: h
        range: [1.0, 500.0]
      runvolume:
        default: 5000
        if:
          backwash_control: 'volume'
        uom: m3
        range: [10, 100000]

outputs:
  hydraulic:
    hydraulic_line:
      headloss_influent:
        uom: mH2O
        equation: "pressure_loss_nozzles + influent_pressure_loss if spray else influent_pressure_loss"
      headloss_model:
        equation: "average_headloss + fall_height_to_media - supernatant_level if not pressurized else average_headloss"

  design:
    general:
      surface_area:
        uom: m2
        equation: "length * width if shape == 'rectangular' else 3.1415 * diameter**2 / 4"
      total_surface:
        uom: m2
        equation: "surface_area * units"
      filtration_velocity:
        uom: m/h
        equation: "capacity / surface_area"


    backwash:
      runtime_volume:
        uom: m3
        equation: "runtime * capacity if backwash_control == 'time' else runvolume"
        precision: 0
      backwash_duration:
        uom: min
        equation: "_backwash_duration"
      backwash_volume:
        uom: m3
        equation: "max(_backwash_volume, 0.0001)"
      max_rate:
        equation: "max(_backwash_max_rate, 0.01)"
        uom: 'm/h'

      backwash_loss:
        uom: "%"
        equation: backwash_volume / runtime_volume

  energy:
    backwash:
      backwash_energy:
        uom: kWh/m3
        equation: "backwash_power_consumption / runtime_volume"
        parameters:
          backwash_power_consumption:
            uom: kWh
            equation: "backwash_volume * 9.81 * backwash_head * 1/backwash_pump_efficiency / 3600"

  sustainability:
    direct_emissions:
      co2_emission:
        if: "spray"
        equation: "quality.influent.product.total('CO2','mg') - aerated.total('CO2','mg')"
        uom: gCO2-eq/m3
        precision: 2
      methane_emission:
        if: "spray"
        equation: "methane_removal * methane_factor"
        uom: gCO2-eq/m3
        precision: 2
        parameters:
          methane_removal:
            uom: "g/m3"
            precision: 2
            equation: "(quality.influent.product.total('Mtg') - aerated.total('Mtg'))*16.04"
          methane_factor:
            uom: "gCO2-eq/gCH4"
            precision: 0
            equation: "db.methane_emission_factor"