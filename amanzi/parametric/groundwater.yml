parameters:
  design:
    general:
      yearly_production:
        uom: Mm3
        default: 10.0
        range: [0.1, 100]

      minimal_capacity:
        uom: m3/h
        default: 500
        range: [1, 10000]
      nominal_capacity:
        uom: m3/h
        default: 1000
        range: [1, 10000]
      maximal_capacity:
        uom: m3/h
        default: 1500
        range: [1, 10000]
      
    well_design:
      number_of_wells:
        default: 4
        uom: "-"
        range: [1, 40]
      average_well_capacity:
        uom: m3/h
        default: 100
        range: [1, 500]
      average_elevation:
        uom: m
        default: 0.0
        range: [-10, 50]
      average_groundwater_level:
        uom: m
        default: -1.0
        range: [-10, 20]
      average_drawdown:
        uom: m
        default: 3.0
        range: [0.1, 10]
      minor_losses:
        uom: m
        default: 1.0
        range: [0.0, 3.0]
      influent_pressure_loss:
        uom: m
        default: 0.0
        range: [0.0, 100.0]
    
    transport_pipe:
      pipe_inner_diameter:
        uom: mm
        default: 200
        range: [100, 2500]
      pipe_length:
        uom: m
        default: 1000
        range: [100, 5000]
      pipe_material:
        default: "PE"
        options: ["PE", "PVC", "Steel"]


outputs:
  design:
    capacity:
      installed_capacity:
        uom: 'm3/h'
        equation: "number_of_wells * average_well_capacity"
        precision: 0
      average_day:
        uom: 'm3/h'
        equation: "yearly_production * 1e6 / 24 / 365"
        precision: 0
        validation: "average_day < installed_capacity"
      wells_in_use:
        uom: "-"
        equation: "math.ceil(capacity / average_well_capacity)"
        precision: 0
        validation: "wells_in_use <= number_of_wells"
      wells_standby:
        uom: "-"
        equation: "max(0,number_of_wells - wells_in_use)"
        precision: 0
    headloss:
      headloss_pipe:
        uom: m
        equation: "5"
        parameters:
          average_velocity:
            uom: m/s
            precision: 2
            equation: "capacity / 3600 / (3.14159 * (pipe_inner_diameter/1000)**2 / 4)"
          kinematic_viscosity:
            uom: mm2/s
            precision: 2
            equation: "1.308"
          reynolds_number:
            uom: "-"
            precision: 0
            equation: "average_velocity * (pipe_inner_diameter/1000) / (kinematic_viscosity*1e-6)"
          turbulent_flow:
            uom: "-"
            precision: 0
            equation: "1 if reynolds_number > 4000 else 0"









