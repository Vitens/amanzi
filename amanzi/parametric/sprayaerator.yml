parameters:
  design:
    hydraulic_line:
      fall_height:
        default: 0.5
        if:
          spray: true
        uom: m
        description: Height of the spray nozzle above the water surface [m]
        range: [0.01, 10]
    sprayaerator:
      area_per_nozzle:
        default: 1
        if:
          spray: true
        uom: m2
        description: Area of the spray nozzle [m2]
        range: [0.1, 10]
      blowereficiency:
        if:
          spray: true
        uom: "-"
        default: 0.75
        range: [0.01, 1]
  operational:
    general:
      rq:
        default: 2
        if:
          spray: true
        uom: "-"
        description: Ratio of air to water flow rate
        range: [1,5]
      ambient_temperature:
        default: 15
        if:
          spray: true
        uom: "C"
        description: Ambient temperature [C]
        range: [-30, 40]


outputs:
  design:
    general:
      total_nozzles:
        if: "spray"
        name: Total Nozzles
        description: Total number of nozzles in the spray aeration unit
        equation: "surface_area / area_per_nozzle"
        uom: '-'
      total_air_flow:
        if: "spray"
        name: Total Air Flow
        description: Total air flow rate through the spray aeration unit
        equation: "rq * capacity"
        uom: m3/h
  
  energy:
    electric_energy:
      blower_energy:
        if: "spray"
        uom: kWh/m3
        equation: "blower_power(rq, ambient_temperature ,100 ,blowereficiency, Air_density)"
        precision: 4
        parameters:
          blowerefficiency:
            uom: "-"
            equation: "blowereficiency"
            precision: 2
          resparitoryquotient:
            uom: "-"
            equation: "rq"
            precision: 2  


      