parameters:
  design:
    general:
      diameter:
        uom: m
        default: 1.0
        range: [0.1, 10]
      bed_height:
        uom: m
        default: 2.0
        range: [0.1, 10]
      packingmaterial:
        default: "Raflux50"
        range: ["Raflux25", "Raflux50", "Raflux90"]
    operational:
      rqd:
        uom: "-"
        default: 0.5
        range: [0.01, 1]
      ambient_temperature:
        uom: "C"
        default: 20
        range: [-30, 40]
    
outputs:
  design:
    toweraeration:
      volume:
        uom: m3
        equation: "math.pi * (diameter/2)**2 * bed_height"
        precision: 2


