parameters:
  design:
    toweraeration:
      diameter:
        uom: m
        default: 1.0
        range: [0.1, 10]
      bed_height:
        uom: m
        default: 2.0
        range: [0.1, 10]
      packingmaterial:
        default: "Raflux50"
        options: ["Raflux25", "Raflux50", "Raflux90"]
      blowereficiency:
        uom: "-"
        default: 0.75
        range: [0.01, 1]

  operational:
    general:
      rq:
        uom: "-"
        default: 2
        range: [0.01, 100]
      ambient_temperature:
        uom: "C"
        default: 20
        range: [-30, 40]
  


outputs:
  design:
    general:
      volume:
        uom: m3
        equation: "math.pi * (diameter/2)**2 * bed_height"
        precision: 2
      total_surface:
        uom: m2
        equation: "volume * packing['ageo']"
        precision: 2
      pressuredrop:
        uom: mbar/m
        equation: "operationpoint(capacity, rq,diameter, engel_stickl)[0]/100"
        precision: 2
      total_pressure_drop:
        uom: Pa
        equation: "operationpoint(capacity, rq,diameter, engel_stickl)[0]*bed_height"
        precision: 1
    packing:
      surfacevolumeration:
        uom: m2/m3
        equation: "packing['ageo']"
        precision: 0
      packingsize:
        uom: mm
        equation: "packing['size']"
        precision: 0
      voidfraction:
        uom: "-"
        equation: "packing['void']"
        precision: 2
      a-factor:
        uom: "-"
        equation: "packing['a']"
        precision: 2
      b-factor:
        uom: "-"
        equation: "packing['b']"
        precision: 2
    operation:
      liquidloading:
        uom: m3/m2/h
        equation: "capacity/(3.14*(diameter/2)**2)"
        precision: 2
      floodingfactor:
        uom: "-"
        equation: "operationpoint(capacity, rq,diameter, engel_stickl)[3]*100"
        precision: 2
      liquid_holdup:
        uom: m3/m3
        equation: "operationpoint(capacity, rq,diameter, engel_stickl)[1]*100"
        precision: 2
      F-Factor:
        uom: "√Pa"
        equation: "operationpoint(capacity, rq,diameter, engel_stickl)[2]"
        precision: 2



    
  energy:
    electric_energy:
      blower_energy:
        uom: kWh/m3
        equation: "blower_power(rq, ambient_temperature ,deltap ,blowereficiency, Air_density)"
        precision: 4
        parameters:
          deltap:
            uom: Pa
            equation: "operationpoint(capacity, rq,diameter, engel_stickl)[0]*bed_height"
            precision: 2
          blowerefficiency:
            uom: "-"
            equation: "blowereficiency"
            precision: 2
          resparitoryquotient:
            uom: "-"
            equation: "rq"
            precision: 2    