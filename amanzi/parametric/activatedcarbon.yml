parameters:
  design:
    filter:
      shape:
        default: 'rectangular'
        options: ['rectangular', 'circular']
      length:
        default: 10
        uom: m
        if:
          shape: 'rectangular'
        range: [1, 20]
      width:
        default: 2.5
        uom: m
        if:
          shape: 'rectangular'
        range: [0.5, 5.0]
      diameter:
        default: 3.0
        uom: m
        if:
          shape: 'circular'
        range: [0.2, 8.0]
      bed_height:
        uom: m
        default: 2.0
        range: [0.1, 10]
  chemicals:
    general:
      packing_type:
        default: 'NORIT-Supra-0,8'
        options: ['NORIT-Supra-0,8', 'NORIT-Supra-1,0', 'NORIT-Supra-1,2', 'NORIT-Supra-1,5', 'NORIT-Supra-2,0']
      apparent_density:
        uom: kg/m3
        default: 500
        range: [100, 2000]
      particle_diameter:
        uom: mm
        default: 0.8
        range: [0.1, 10]
      particle_density:
        uom: kg/m3
        default: 2000
        range: [1000, 5000]
      bed_porosity:
        uom: '-'
        default: 0.5
        range: [0.1, 0.9]
      bed_porosity_clogged:
        uom: '-'
        default: 0.3
        range: [0.1, 0.9]
    
      particle_porosity:
        uom: '-'
        default: 0.6
        range: [0.1, 0.9]
  model:
    general:
      design_limit:
        default: sum20PFAS_limit
        options: [sum4PFAS_limit, sum20PFAS_limit, PEQ_limit]
      stationary_calculation:
        default: false
      replacement_interval:
        uom: 'days'
        default: 500
        if:
          stationary_calculation: true
        range: [1, 10000]
      replacement_loading:
        if:
          stationary_calculation: false
        uom: '%'
        default: 0.5
        range: [0.01, 1]
      staggered_replacement:
        if:
          stationary_calculation: false
        default: no_staggering
        options: [no_staggering, limit_staggering, fixed_staggering]
      fixed_staggering_interval:
        if:
          staggered_replacement: fixed_staggering
        uom: days
        default: 500
        range: [1, 10000]
      mass_transfer_coefficient:
        if:
          stationary_calculation: false
        uom: 1/s
        default: 0.009
        range: [0.0001, 1]
      
      include_doc_competition:
        if:
          stationary_calculation: false
        type: boolean
        default: true

      

      
        
outputs:
  design:
    activatedcarbon:
      volume:
        uom: m3
        equation: "length * width * bed_height if shape == 'rectangular' else math.pi * (diameter/2)**2 * bed_height"
        precision: 2
      surface_area:
        uom: m2
        equation: "length * width if shape == 'rectangular' else 3.1415 * diameter**2 / 4"
      total_surface:
        uom: m2
        equation: "surface_area * units"
      filtration_velocity:
        uom: m/h
        equation: "capacity / surface_area"
      EBCT:
        uom: min
        equation: "bed_height / filtration_velocity * 60"
    pressure_loss:
      headloss_clean:
        uom: mH2O
        equation: "headloss_clean"
        parameters:
          headloss_clean:
            uom: mH2O
            equation: "kozeny_carman(bed_porosity, filtration_velocity, particle_diameter) * bed_height"
      headloss_clogged:
        uom: mH2O
        equation: "headloss_clogged"
        parameters:
          headloss_clogged:
            uom: mH2O
            equation: "kozeny_carman(bed_porosity_clogged, filtration_velocity, particle_diameter) * bed_height"
      average_headloss:
        uom: mH2O
        equation: "(headloss_clean + headloss_clogged) / 2"
    replacement:
      replacement_days:
        uom: days
        equation: "replacement_interval"
        precision: 0
      carbon_replaced_per_year:
        uom: kg/year
        if: "staggered_replacement"
        equation: "volume * apparent_density * 365 / replacement_interval"
      carbon_replacment:
        uom: kg
        if: "not staggered_replacement"
        equation: "volume * apparent_density"
      



  energy:
    backwash:
      backwash_energy:
        uom: kWh/m3
        equation: "backwash_power_consumption / runtime_volume"
        parameters:
          backwash_power_consumption:
            uom: kWh
            equation: "backwash_volume * 9.81 * backwash_head * 1/backwash_pump_efficiency / 3600"