parameters:
  design:
    general:
      advanced:
        type: boolean
        default: false
      diameter:
        uom: m
        default: 1.0
        range: [0.1, 10]
      bed_height:
        uom: m
        default: 2.0
        range: [0.1, 10]


  operational:
    general:
      staggered_replacement:
        default: true
      replacement_interval:
        uom: days
        default: 1000
        range: [1, 10000]
      replacement_loading:
        uom: "%"
        default: 0.5
        range: [0.01, 1]
      backwash_interval:
        uom: days
        default: 30
        range: [1, 1000]
      backwash_duration:
        uom: hours
        default: 2
        range: [0.1, 24]
      backwash_flowrate:
        uom: m3/h
        default: 10
        range: [0.1, 1000]

  chemicals:
    general:
      packing_type:
        default: "NORA Supra 0.8"
        options: ["NORA Supra 0.8", "NORA Supra 1.0", "NORA Supra 1.2", "NORA Supra 1.5", "NORA Supra 2.0"]
      apparent_density:
        uom: kg/m3
        default: 500
        range: [100, 2000]
      particle_diameter:
        uom: mm
        default: 0.8
        range: [0.1, 10]
      particle_density:
        uom: kg/m3
        default: 2000
        range: [1000, 5000]
      bed_porosity:
        uom: "-"
        default: 0.5
        range: [0.1, 0.9]
      particle_porosity:
        uom: "-"
        default: 0.6
        range: [0.1, 0.9]
      
      

      
        
      



outputs:
  design:
    activated_carbon:
      volume:
        uom: m3
        equation: "math.pi * (diameter/2)**2 * bed_height"
        precision: 2
      replacement:
        uom: days
        equation: "replacement_interval"
        precision: 0

    