parameters:
  chemicals:
    general:
      chemical:
        default: 'CO2'
        options: ['CO2', 'HCl', 'H2SO4', 'NaOH' , 'Ca(OH)2', 'CaCO3','O2', ' FeCl3','MnCl2' ]
      mode: 
        default: constant
        options: [constant, setpoint]
      setpoint_parameter:
        if: 
          mode: setpoint
        default: 'pH'
        options: ['pH', 'SI', 'AggCO2', 'TACC90']
      dosage:
        if: 
          mode: constant
        name: 'Dosing'
        uom: 'mmol/L'
        default: 0.0
        range: [0, 100]
      setpoint:
        if: 
          mode: setpoint
        name: Setpoint
        uom: mode
        default: 7.0
        range: [0, 14]