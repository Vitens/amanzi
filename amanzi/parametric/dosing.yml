parameters:
  chemicals:
    general:
      chemical:
        default: 'CO2'
        options: ['CO2', 'HCl', 'H2SO4', 'NaOH' , 'Ca(OH)2', 'CaCO3','O2', 'FeCl3','MnCl2' ]
      mode: 
        default: constant
        options: [constant, setpoint]
      setpoint_parameter:
        if: 
          mode: setpoint
        default: 'pH'
        options: ['pH', 'SI', 'AggCO2', 'CCPP90']
      dosage:
        if: 
          mode: constant
        uom: 'mmol/L'
        default: 0.2
        range: [0, 5]
      setpoint:
        if: 
          mode: setpoint
        uom: ""
        default: 7.0
        range: [0, 14]