parameters:
  design:
    membrane_degassing:
      num_stages:
        default: 2
        range: [1, 2]
      membranes_per_stage:
        default: 4
        range: [1, 10]
      membrane_type:
        default: EXF14x40
        options: [EXF14x40, EXF14x28]
      vacuum_type:
        default: liquid-ring 
        options: ['liquid-ring', 'screw']
      nitrogen_source:
        default: cryogenic
        options: ['cryogenic', 'PSA']
      nitrogen_purity:
        default: 4
        uom: '-'
        range: [1, 5]
    hydraulic_line:
      inlet_elevation:
        default: 0
      pressurized:
        default: true
        hidden: true
  operational:
    base:
      vacuum_stage_1:
        default: 0.10
        uom: bar
        range: [0.01, 1.0]
      vacuum_stage_2:
        default: 0.10
        uom: bar
        range: [0.01, 1.0]
      n2_rq_stage_1:
        default: 0.002
        uom: Nm3/m3
        range: [0.0, 1.0]
      n2_rq_stage_2:
        default: 0.03
        uom: Nm3/m3
        range: [0.0, 1.0]
      co2_rq_stage_1:
        default: 0.002
        uom: Nm3/m3
        range: [0.0, 1.0]
      co2_rq_stage_2:
        default: 0.03
        uom: Nm3/m3
        range: [0.0, 1.0]


outputs:
  hydraulic:
    hydraulic_line:
      headloss_model:
        equation: "8"

      integrated_booster:
        uom: '-'
        equation: "1"
  design:
    general:
      total_membranes:
        uom: '-'
        equation: "num_stages * membranes_per_stage"

  energy:
    vacuum_pumps:
      stage_1:
        uom: kWh/m3
        equation: "0.01"
      stage_2:
        uom: kWh/m3
        equation: "0.01"
    production:
      generator:
        uom: kWh/m3
        equation: "-0.01"
    
