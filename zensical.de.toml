# Amanzi user documentation — Deutsch
# Parallel sites: zensical.toml (docs/en), zensical.nl.toml (docs/nl).
# Language switcher links point at the GitHub Pages project site:
# /amanzi/en/, /amanzi/nl/, and /amanzi/de/.
#
# Authoring (Diátaxis):
# - Tutorials: one happy path, demo data, no literature, no parameter dumps.
# - How-tos: one goal, numbered steps, assume a tutorial is already done.
# - Reference: facts only (controls, units, streams). No "why".
# - Explanation: why / theory / literature. No click-by-click steps.
# - Diagrams: Mermaid fenced blocks only (rendered as SVG in the page).
#   Do not commit duplicate .svg exports of the same diagram.

[project]
site_name = "Amanzi"
site_description = "Benutzerdokumentation für das Amanzi-Szenariotool zur Trinkwasseraufbereitung"
site_author = "Vitens N.V."
copyright = "© Vitens N.V. — licensed under GPL-3.0"
docs_dir = "docs/de"
site_dir = "site/de"
dev_addr = "localhost:8003"
repo_url = "https://github.com/Vitens/amanzi"
repo_name = "Vitens/amanzi"
site_url = "https://vitens.github.io/amanzi/de/"

nav = [
  { "Start" = "index.md" },
  { "Anleitungen" = [
    "tutorials/index.md",
    { "Amanzi öffnen" = "tutorials/open-amanzi.md" },
