    { "Ihre Arbeit speichern" = "tutorials/save-your-work.md" },
  ] },
  { "Handlungsanleitungen" = [
    "how-to/index.md",
    { "Gehostet oder lokal öffnen" = "how-to/open-hosted-or-local.md" },
    { "Speichern, laden, herunterladen" = "how-to/save-load-download.md" },
    { "Einheiten hinzufügen und verbinden" = "how-to/add-and-connect-units.md" },
    { "Eine Einheit konfigurieren" = "how-to/configure-a-unit.md" },
    { "Kennzahlen festlegen" = "how-to/set-key-figures.md" },
    { "Entwurfsansicht nutzen" = "how-to/use-design-view.md" },
    { "Im Bericht vergleichen" = "how-to/compare-in-report.md" },
    { "Mit Mikroschadstoffen arbeiten" = "how-to/work-with-micropollutants.md" },
