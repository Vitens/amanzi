    { "Ergebnisse" = "reference/results.md" },
    { "Kennzahlen" = "reference/key-figures.md" },
    { "Maßeinheiten" = "reference/units.md" },
    { "Glossar" = "reference/glossary.md" },
    { "Einschränkungen" = "reference/limitations.md" },
    { "Prozesseinheiten" = [
      "reference/process-units/index.md",
      { "Gewinnen" = "reference/process-units/groundwater.md" },
      { "Reservoir" = "reference/process-units/reservoir.md" },
      { "Sandfiltration" = "reference/process-units/sandfiltration.md" },
