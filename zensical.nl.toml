[project.theme]
language = "nl"
logo = "media/site_logo.png"
features = [
  "navigation.tabs",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "navigation.path",
  "toc.follow",
  "search.suggest",
  "content.code.copy",
]

[[project.extra.alternate]]
name = "English"
link = "/en/"
lang = "en"

[[project.extra.alternate]]
name = "Nederlands"
link = "/nl/"
lang = "nl"

[[project.extra.alternate]]
name = "Deutsch"
link = "/de/"
lang = "de"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
