[project]
name = "Amanzi"
description = "Amanzi scenario tool developed by Vitens"
version = "1.0.4"
authors = [
    { name="Abel Heinsbroek", email="abel.heinsbroek@vitens.nl" },
    { name="Nils Zickermann", email="nils.zickermann@vitens.nl" }
]
readme = "README.md"
license = {file="LICENSE"}
dependencies = [
    "numpy",
    "phreeqpython",
    "dotmap",
    "pyaml",
    "pandas",
    "scipy",
    "flask",
    "flask-cors",
    "click",
]
keywords = ["water treatment", "scenario tool", "slimm", "vitens", "drinking water"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
[project.urls]
homepage = "https://github.com/Vitens/amanzi"
repository = "https://github.com/Vitens/amanzi"

[project.scripts]
amanzi = "amanzi.server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"ui/dist" = "amanzi/ui/dist"
