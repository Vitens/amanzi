[project]
name = "Amanzi"
description = "Amanzi scenario tool developed by Vitens"
version = "1.0.4"
authors = [
    { name="Abel Heinsbroek", email="abel.heinsbroek@vitens.nl" },
    { name="Nils Zickermann", email="nils.zickermann@vitens.nl" }
]
readme = "README.md"
license = {file="LICENSE"}
dependencies = [
    "numpy==2.4.2",
    "phreeqpython==1.5.7",
    "dotmap==1.3.30",
    "pyaml==25.7.0",
    "pandas==3.0.0",
    "scipy==1.17.0",
    "flask==3.1.2",
    "flask-cors==6.0.2",
    "click==8.3.1",
]
keywords = ["water treatment", "scenario tool", "slimm", "vitens", "drinking water"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
[project.urls]
homepage = "https://github.com/Vitens/amanzi"
repository = "https://github.com/Vitens/amanzi"

[project.scripts]
amanzi = "amanzi.server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"ui/dist" = "amanzi/ui/dist"
