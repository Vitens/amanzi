[project.theme]
logo = "media/site_logo.png"
features = [
  "navigation.tabs",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "navigation.path",
  "toc.follow",
  "search.suggest",
  "content.code.copy",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
