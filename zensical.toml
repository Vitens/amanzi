      { "Plate aeration" = "reference/process-units/plate.md" },
      { "Cascade" = "reference/process-units/cascade.md" },
      { "Pellet softening" = "reference/process-units/softening.md" },
      { "Chemical dosage" = "reference/process-units/dosing.md" },
      { "Membrane filtration" = "reference/process-units/membrane.md" },
      { "Membrane degassing" = "reference/process-units/membranedegassing.md" },
      { "Vacuum degassing" = "reference/process-units/vacuum.md" },
      { "Sand trap" = "reference/process-units/sandtrap.md" },
      { "Transport pipeline" = "reference/process-units/pipeline.md" },
